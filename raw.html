
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">

  <title>https://authorapi.learnosity.schoology.com/v2025.1.LTS/uploader?version=v2025.1.LTS&fileType=</title>

  <style>
    .b::after { content: "link gen 9000"; }
    .c::after { content: "select a link type:"; }
    .d::after { content: "SPIN THE WHEEL!!!"; }
    .e::after { content: "Your link is:"; }
    .f::after { content: "Type: "; }
    .n::after { content: " links loaded across all sites"; }
    .j::after {
      content: "Some links may take a bit to properly load. Please be patient.";
    }

      font-family: sans-serif;

</head>

<body>
  <h1>
    <span class="b"></span>
    <span class="x"></span>
  </h1>

  <p>
    <b id="q">?</b><span class="n"></span>
    <br>
    <span class="c"></span>
    <br><br>

    <select id="l" name="l">
      <option value="-1">any</option>
    </select>

    <br><br>

    <button id="spin">
      <span class="d"></span>
    </button>
  </p>

  <br>

  <div id="link" style="display:none">
    <span class="e"></span>

    <h2>
      <a id="linkOut" href="#" target="_blank" rel="noreferrer">
        example.com
      </a>
    </h2>

    <p>
      <span class="f"></span><span id="typeOut"></span>
      <br>
      <span class="j"></span>
    </p>
  </div>

  <script>
    // ==========================================
    // CONFIGURATION
    // ==========================================

    const CONFIG = {
      repository: "crshqd/sturdy-lamp",
      databaseFile: "tuglamp.json",

      checkEndpoints: [
        "https://test4343434.paperclip.army/",
        "https://gulgalug.o190.com/"
      ],

      maxChecks: 30,
      batchSize: 5,

      endpointTimeout: 4000,
      githubTimeout: 4000,
      deadEndpointCooldown: 5 * 60 * 1000,
      refCacheDuration: 10 * 60 * 1000
    };


    // ==========================================
    // DOM ELEMENTS
    // ==========================================

    const elements = {
      select: document.getElementById("l"),
      spin: document.getElementById("spin"),
      linkBox: document.getElementById("link"),
      linkOutput: document.getElementById("linkOut"),
      typeOutput: document.getElementById("typeOut"),
      linkCount: document.getElementById("q")
    };


    // ==========================================
    // STATE
    // ==========================================

    let database = null;

    const deadEndpoints = new Map();


    // ==========================================
    // GENERAL UTILITIES
    // ==========================================

    function shuffle(array) {
      const result = [...array];

      for (let i = result.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));

        [result[i], result[j]] = [result[j], result[i]];
      }

      return result;
    }


    // ==========================================
    // GITHUB DATABASE
    // ==========================================

    async function githubRequest(path) {
      const response = await fetch(
        `https://api.github.com/repos/${CONFIG.repository}${path}`,
        {
          headers: {
            Accept: "application/vnd.github+json"
          },
          signal: AbortSignal.timeout(CONFIG.githubTimeout)
        }
      );

      if (!response.ok) {
        throw new Error(`GitHub returned ${response.status}`);
      }

      return response.json();
    }


    async function resolveDatabaseRef() {
      const cacheKey = "dbRef";

      try {
        const cached = JSON.parse(
          sessionStorage.getItem(cacheKey) || "null"
        );

        if (
          cached &&
          Date.now() - cached.timestamp < CONFIG.refCacheDuration
        ) {
          return cached.ref;
        }
      } catch {}


      let ref = "latest";

      try {
        const [latestPush] = await githubRequest(
          "/activity?activity_type=push&per_page=1"
        );

        if (latestPush?.after) {
          ref = latestPush.after;
        }
      } catch {
        try {
          const repository = await githubRequest("");

          ref = repository.default_branch;
        } catch {}
      }


      try {
        sessionStorage.setItem(
          cacheKey,
          JSON.stringify({
            ref,
            timestamp: Date.now()
          })
        );
      } catch {}

      return ref;
    }


    function getDatabaseUrl(ref) {
      return `https://cdn.jsdelivr.net/gh/${CONFIG.repository}@${ref}/${CONFIG.databaseFile}`;
    }


    async function loadDatabase() {
      if (database) return database;

      const ref = await resolveDatabaseRef();

      let response = await fetch(getDatabaseUrl(ref));

      if (!response.ok && ref !== "latest") {
        response = await fetch(getDatabaseUrl("latest"));
      }

      if (!response.ok) {
        throw new Error("Database unavailable");
      }

      const data = await response.json();

      if (
        !Array.isArray(data.fullnames) ||
        !Array.isArray(data.contents) ||
        data.fullnames.length !== data.contents.length
      ) {
        throw new Error("Invalid database");
      }

      elements.linkCount.textContent = data.contents.flat().length;

      database = data;

      return database;
    }


    // ==========================================
    // ENDPOINT HEALTH CHECKING
    // ==========================================

    async function checkEndpoint(endpoint, url) {
      try {
        const response = await fetch(
          `${endpoint}?url=${encodeURIComponent(url)}`,
          {
            signal: AbortSignal.timeout(CONFIG.endpointTimeout)
          }
        );

        if (!response.ok) return null;

        const result = (await response.text()).trim().toLowerCase();

        if (result === "true") return true;
        if (result === "false") return false;

        return null;

      } catch {
        return null;
      }
    }


    function getLiveEndpoints() {
      const now = Date.now();

      // Remove expired endpoint failures.
      for (const [endpoint, timestamp] of deadEndpoints) {
        if (now - timestamp > CONFIG.deadEndpointCooldown) {
          deadEndpoints.delete(endpoint);
        }
      }

      const available = CONFIG.checkEndpoints.filter(
        endpoint => !deadEndpoints.has(endpoint)
      );

      // Retry everything if all endpoints are marked dead.
      return shuffle(
        available.length ? available : CONFIG.checkEndpoints
      );
    }


    async function isBlocked(url) {
      for (const endpoint of getLiveEndpoints()) {
        const result = await checkEndpoint(endpoint, url);

        if (result !== null) {
          deadEndpoints.delete(endpoint);

          return result;
        }

        deadEndpoints.set(endpoint, Date.now());
      }

      // Fail closed if every endpoint fails.
      return true;
    }


    // ==========================================
    // RANDOM LINK SELECTION
    // ==========================================

    async function getRandomLink(category) {
      const data = await loadDatabase();

      let candidates;

      if (category === "-1") {
        candidates = data.contents.flatMap((links, categoryId) =>
          Array.isArray(links)
            ? links.map(link => ({
                link,
                categoryId
              }))
            : []
        );

      } else {
        const categoryId = Number(category);
        const links = data.contents[categoryId];

        candidates = Array.isArray(links)
          ? links.map(link => ({
              link,
              categoryId
            }))
          : [];
      }

      if (!candidates.length) {
        throw new Error("No links available");
      }

      // Randomize and limit the number of checks.
      candidates = shuffle(candidates).slice(0, CONFIG.maxChecks);

      // Check links in batches.
      for (
        let i = 0;
        i < candidates.length;
        i += CONFIG.batchSize
      ) {
        const batch = candidates.slice(i, i + CONFIG.batchSize);

        const results = await Promise.all(
          batch.map(async entry => ({
            entry,
            blocked: await isBlocked(entry.link)
          }))
        );

        const available = results.find(
          result => !result.blocked
        );

        if (available) {
          const entry = available.entry;

          return {
            link: entry.link,
            category: data.fullnames[entry.categoryId]
          };
        }
      }

      throw new Error("No available links");
    }


    // ==========================================
    // CATEGORY DROPDOWN
    // ==========================================

    async function loadCategories() {
      try {
        const data = await loadDatabase();

        data.fullnames.forEach((name, index) => {
          const option = document.createElement("option");

          option.value = String(index);
          option.textContent = name;

          elements.select.appendChild(option);
        });

      } catch (error) {
        console.error("Could not load categories:", error);
      }
    }


    // ==========================================
    // DISPLAY
    // ==========================================

    function showError(message) {
      elements.linkOutput.removeAttribute("href");
      elements.linkOutput.textContent = message;

      elements.typeOutput.textContent = "-";

      elements.linkBox.style.display = "block";
    }


    function showLink(result) {
      let valid = false;

      try {
        valid = /^https?:$/.test(
          new URL(result.link).protocol
        );
      } catch {}

      if (!valid) {
        showError("Got an invalid link, try again");
        return;
      }

      elements.linkOutput.href = result.link;
      elements.linkOutput.textContent = result.link;

      elements.typeOutput.textContent = result.category;

      elements.linkBox.style.display = "block";
    }


    // ==========================================
    // SPIN BUTTON
    // ==========================================

    async function spinWheel() {
      elements.spin.disabled = true;

      try {
        const result = await getRandomLink(elements.select.value);

        showLink(result);

      } catch (error) {
        console.error(error);

        showError(
          error.message || "Something went wrong"
        );

      } finally {
        elements.spin.disabled = false;
      }
    }


    // ==========================================
    // INITIALIZATION
    // ==========================================

    elements.spin.addEventListener("click", spinWheel);

    loadCategories();
  </script>
</body>
</html>
