async function gh(path) {
  const r = await fetch("https://api.github.com/repos/" + REPO + path, {
    headers: { Accept: "application/vnd.github+json" },
    signal: AbortSignal.timeout(4000)
  });
  if (!r.ok) throw new Error("GitHub " + r.status);
  return r.json();
}

// Returns the newest pushed commit SHA (or branch name), else "latest"
async function resolveRef() {
  // cache for 10 min so we don't burn the 60 req/hr unauthenticated limit
  try {
    const c = JSON.parse(sessionStorage.getItem("dbRef") || "null");
    if (c && Date.now() - c.t < 600000) return c.ref;
  } catch {}

  let ref = "latest";
  try {
    // most recent push to any branch
    const [push] = await gh("/activity?activity_type=push&per_page=1");
    ref = push.after;                      // commit SHA: always fresh, no CDN branch caching
  } catch {
    try {
      // fallback: default branch name
      ref = (await gh("")).default_branch;
    } catch {}
  }
  try { sessionStorage.setItem("dbRef", JSON.stringify({ ref, t: Date.now() })); } catch {}
  return ref;
}

let db = null;
async function loadDb() {
  if (db) return db;
  const ref = await resolveRef();
  let t = await fetch(dbUrl(ref));
  if (!t.ok && ref !== "latest") t = await fetch(dbUrl("latest")); // last-resort fallback
  if (!t.ok) throw new Error("Database unavailable");
  const e = await t.json();
  if (!Array.isArray(e.fullnames) || !Array.isArray(e.contents) || e.fullnames.length !== e.contents.length) throw new Error("Invalid database");
  document.getElementById("q").innerHTML = e.contents.flat().length;
  return db = e;
}

  function shuffled(t) {
    const e = t.slice();
    for (let t = e.length - 1; t > 0; t--) {
      const n = Math.floor(Math.random() * (t + 1));
      [e[t], e[n]] = [e[n], e[t]]
    }
    return e
  }
const dead = new Map();            // base -> time it was marked dead
const DEAD_FOR_MS = 5 * 60 * 1000; // retry a dead domain after 5 minutes
const TIMEOUT_MS = 4000;

async function checkOne(base, url) {
  try {
    const res = await fetch(base + "?url=" + encodeURIComponent(url), {
      signal: AbortSignal.timeout(TIMEOUT_MS)
    });
    if (!res.ok) return null;                 // endpoint problem
    const text = (await res.text()).trim().toLowerCase();
    if (text === "true") return true;
    if (text === "false") return false;
    return null;                              // unexpected response
  } catch {
    return null;                              // network/CORS/timeout
  }
}

function liveEndpoints() {
  const now = Date.now();
  for (const [base, t] of dead) {
    if (now - t > DEAD_FOR_MS) dead.delete(base);   // give it another chance
  }
  const live = CHECK_URLS.filter(b => !dead.has(b));
  // If everything is marked dead, try them all again rather than giving up
  return shuffled(live.length ? live : CHECK_URLS);
}

async function isBlocked(url) {
  for (const base of liveEndpoints()) {
    const result = await checkOne(base, url);
    if (result !== null) {
      dead.delete(base);                      // it worked, so it's healthy
      return result;
    }
    dead.set(base, Date.now());               // failed, skip it for a while
  }
  return true; // every endpoint failed -> fail closed
}
